name: HarmonyOS 功能建议
description: 为 NeriPlayer-HarmonyOS 提出可执行的移植或体验改进建议
title: "[HarmonyOS Feature] "
body:
  - type: markdown
    attributes:
      value: |
        本仓库的 Android 代码只作为行为参照；功能建议请明确 HarmonyOS 主线的目标范围。

  - type: dropdown
    id: area
    attributes:
      label: 功能区域
      options:
        - 播放核心或后台播放
        - 搜索、网络平台或登录
        - 歌词、界面或交互
        - 下载、本地媒体或同步
        - 多设备适配
        - 构建、测试或开发体验
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景、当前限制和受影响的用户。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、入口、失败路径和兼容性要求。
    validations:
      required: true

  - type: textarea
    id: android_reference
    attributes:
      label: Android 参照（可选）
      description: 填写 Android 上游源码路径、Issue 或行为差异；不要直接要求逐行翻译实现。
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 列出可以通过构建、单测、ohosTest 或人工 smoke test 验证的结果。
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复建议。
          required: true
        - label: 我已考虑 HarmonyOS API 24 基线和失败降级路径。
          required: true
