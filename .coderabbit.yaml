# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI 审查配置。生效前提：在 GitHub 安装 CodeRabbit App
# （https://github.com/apps/coderabbitai — 公开仓库免费，私有仓库收费）。
language: "zh-CN"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "dev"
      - "android-parity"
  # 只审主线：排除 Android 参照快照、ASCF 实验与第三方解包目录（职责划分见根 AGENTS.md），
  # 并排除 UI 自动化控件树 dump（tools/.m9，数百个只增不改的证据文件）
  path_filters:
    - "!NeriPlayer-master/**"
    - "!NeriPlayer-ASCF/**"
    - "!package/**"
    - "!ascf-support-plugin/**"
    - "!**/oh_modules/**"
    - "!**/build/**"
    - "!**/.hvigor/**"
    - "!NeriPlayer-HarmonyOS/tools/.m9/**"
  path_instructions:
    - path: "**/*.ets"
      instructions: |
        这是 HarmonyOS ArkTS（API 26，compatibleSdkVersion "26.0.0"）代码。权威项目约定见根 AGENTS.md 与 .github/instructions/arkts.instructions.md，审查重点：
        1. ArkTS 严格模式：禁止 any、无说明的类型断言与隐式转换；
        2. 页面只渲染状态并派发意图，业务/耗时逻辑不得写进 @Entry/@Component 生命周期；异步的成功与失败路径都要释放资源（文件句柄、监听器、计时器、HTTP 请求）；
        3. 状态管理装饰器（@State/@Prop/@Link/@Provide/@Consume）使用是否正确；
        4. UI 改动需兼顾 phone/tablet/2in1 多宽度、横竖屏、返回栈、文本缩放与触控目标，不要只适配单一形态；
        5. 日志不得输出密钥、Token、Cookie 或用户敏感路径；
        6. 改动 SongIdentity.ets 稳定歌曲键（<id>|<album>|<mediaUri>）语义属阻断性问题，除非附带迁移方案、跨端 fixture 与回归测试。
        注意：CodeRabbit 内置 TS linter 不识别 ArkTS 装饰器与 struct 语法，相关报错请忽略，以项目 codelinter 基线为准。

chat:
  auto_reply: true
